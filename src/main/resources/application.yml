spring:
  application:
    name: repit-chat

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    reactor.netty.http.client.HttpClientConnect: ERROR

repit:
  api-server:
    base-url: https://wildcat-startle-rope.ngrok-free.dev
    internal-token: ${INTERNAL_AUTH_TOKEN:}

anthropic:
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  api-key: ${ANTHROPIC_API_KEY}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  max-concurrent-requests: 50
  connect-timeout: 2s
  response-timeout: 5s
  follow-up-max-tokens: 800
  pool:
    max-connections: 50
    pending-acquire-max-count: 50
    pending-acquire-timeout: 2s

tts:
  enabled: ${TTS_ENABLED:false}
  default-voice-index: 1
  profile-version: persona-tts-v1
  spoken-text:
    min-length-ratio: 0.5
    max-length-ratio: 2.5
  elevenlabs:
    base-url: ${ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
    api-key: ${ELEVENLABS_API_KEY:}
    model-id: eleven_multilingual_v2
    output-format: mp3_44100_128
    connect-timeout: 3s
    response-timeout: 20s
    pool:
      max-connections: 8
      pending-acquire-max-count: 16
  voices:
    1: ${TTS_VOICE_ID_1:}
    2: ${TTS_VOICE_ID_2:}
    3: ${TTS_VOICE_ID_3:}
    4: ${TTS_VOICE_ID_4:}
    5: ${TTS_VOICE_ID_5:}
  defaults:
    similarity-boost: 0.8
    use-speaker-boost: true
  presets:
    cells:
      GENTLE:
        FRIENDLY: { stability: 0.78, style: 0.00, speed: 0.98 }
        REALISTIC: { stability: 0.76, style: 0.05, speed: 1.00 }
        METICULOUS: { stability: 0.80, style: 0.03, speed: 0.99 }
      DIRECT:
        FRIENDLY: { stability: 0.38, style: 0.42, speed: 1.13 }
        REALISTIC: { stability: 0.51, style: 0.30, speed: 1.12 }
        METICULOUS: { stability: 0.42, style: 0.48, speed: 1.14 }
      PRESSURING:
        FRIENDLY: { stability: 0.12, style: 0.90, speed: 1.18 }
        REALISTIC: { stability: 0.12, style: 0.98, speed: 1.20 }
        METICULOUS: { stability: 0.01, style: 1.00, speed: 1.19 }
  pause:
    enabled: false
    max-per-question: 2
  queue:
    global-max-concurrency: 4
    prefetch-max-concurrency: 3
    per-session-max: 2
    per-session-prefetch-max: 1
  retry:
    max-retries: 2
    backoffs: [1s, 2s]
    upload-retries: 2
  long-poll:
    default-wait: 20s
    max-wait: 25s
  storage:
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:}
    public-base-url: ${S3_URL:}
    key-prefix: tts
    cache-control: public, max-age=3600
