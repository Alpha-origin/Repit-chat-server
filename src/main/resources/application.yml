spring:
  application:
    name: repit-chat

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

repit:
  api-server:
    base-url: https://wildcat-startle-rope.ngrok-free.dev

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
