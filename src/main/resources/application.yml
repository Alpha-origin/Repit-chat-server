spring:
  application:
    name: repit-chat

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    reactor.netty.http.client.HttpClientConnect: ERROR

repit:
  api-server:
    base-url: https://wildcat-startle-rope.ngrok-free.dev
    internal-token: ${INTERNAL_AUTH_TOKEN:}

anthropic:
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  api-key: ${ANTHROPIC_API_KEY}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  max-concurrent-requests: 50
  connect-timeout: 2s
  response-timeout: 5s
  follow-up-max-tokens: 800
  pool:
    max-connections: 50
    pending-acquire-max-count: 50
    pending-acquire-timeout: 2s

tts:
  enabled: ${TTS_ENABLED:false}
  default-voice-index: 1
  profile-version: persona-tts-v1
  spoken-text:
    min-length-ratio: 0.5
    max-length-ratio: 2.5
  elevenlabs:
    base-url: ${ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
    api-key: ${ELEVENLABS_API_KEY:}
    model-id: eleven_multilingual_v2
    output-format: mp3_44100_128
    connect-timeout: 3s
    response-timeout: 20s
    pool:
      max-connections: 8
      pending-acquire-max-count: 16
  voices:
    1: ${TTS_VOICE_ID_1:}
    2: ${TTS_VOICE_ID_2:}
    3: ${TTS_VOICE_ID_3:}
    4: ${TTS_VOICE_ID_4:}
    5: ${TTS_VOICE_ID_5:}
  defaults:
    stability: 0.55
    similarity-boost: 0.8
    style: 0.1
    speed: 1.1
    use-speaker-boost: true
  presets:
    base:
      SOLO:
        GENTLE: { stability: 0.74, style: 0.04, speed: 1.02 }
        DIRECT: { stability: 0.55, style: 0.18, speed: 1.10 }
        PRESSURING: { stability: 0.05, style: 1.00, speed: 1.17 }
      MULTI:
        GENTLE: { stability: 0.72, style: 0.04, speed: 1.02 }
        DIRECT: { stability: 0.42, style: 0.38, speed: 1.13 }
        PRESSURING: { stability: 0.20, style: 0.82, speed: 1.17 }
    tone-adjust:
      GENTLE: { stability: 0.04, style: -0.03, speed: -0.02 }
      DIRECT: { stability: -0.04, style: 0.08, speed: 0.02 }
      PRESSURING: { stability: -0.08, style: 0.12, speed: 0.03 }
    type-adjust:
      FRIENDLY: { stability: 0.0, style: -0.04, speed: -0.02 }
      REALISTIC: { stability: 0.0, style: 0.04, speed: 0.0 }
      METICULOUS: { stability: 0.04, style: 0.02, speed: -0.01 }
  clamp:
    speed-min: 0.8
    speed-max: 1.2
  pause:
    enabled: false
    max-per-question: 2
  queue:
    global-max-concurrency: 4
    prefetch-max-concurrency: 3
    per-session-max: 2
    per-session-prefetch-max: 1
  retry:
    max-retries: 2
    backoffs: [1s, 2s]
    upload-retries: 2
  long-poll:
    default-wait: 20s
    max-wait: 25s
  storage:
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:}
    public-base-url: ${S3_URL:}
    key-prefix: tts
    cache-control: public, max-age=3600
