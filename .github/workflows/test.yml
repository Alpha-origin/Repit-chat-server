name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Run tests
        run: ./gradlew test
      - name: Verify Redis integration tests ran
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          report = 'build/test-results/test/TEST-com.person.repit.interview.service.InterviewResultRedisTest.xml'
          suite = ET.parse(report).getroot()
          assert int(suite.attrib['tests']) > 0, 'Redis integration tests did not run'
          assert int(suite.attrib['skipped']) == 0, 'Redis integration tests were skipped'
          PYTHON
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
