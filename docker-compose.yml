services:
  redis:
    image: redis:7-alpine
    container_name: repit-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  chat:
    build: .
    image: repit-chat
    container_name: repit-chat
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      API_SERVER_URL: ${API_SERVER_URL}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-}
      INTERVIEW_RESULT_RETRY_ENABLED: ${INTERVIEW_RESULT_RETRY_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      ANTHROPIC_COMPANY_FOLLOW_UP_ENABLED: ${ANTHROPIC_COMPANY_FOLLOW_UP_ENABLED:-false}
      ANTHROPIC_COMPANY_FOLLOW_UP_TOTAL_TIMEOUT: ${ANTHROPIC_COMPANY_FOLLOW_UP_TOTAL_TIMEOUT:-5s}
      ANTHROPIC_COMPANY_FOLLOW_UP_GENERATION_TIMEOUT: ${ANTHROPIC_COMPANY_FOLLOW_UP_GENERATION_TIMEOUT:-2s}
      ANTHROPIC_COMPANY_FOLLOW_UP_MAX_TOKENS: ${ANTHROPIC_COMPANY_FOLLOW_UP_MAX_TOKENS:-800}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_MAX_IN_MEMORY_SIZE: ${ELEVENLABS_MAX_IN_MEMORY_SIZE:-8388608}
      TTS_VOICE_ID_1: ${TTS_VOICE_ID_1:-}
      TTS_VOICE_ID_2: ${TTS_VOICE_ID_2:-}
      TTS_VOICE_ID_3: ${TTS_VOICE_ID_3:-}
      TTS_VOICE_ID_4: ${TTS_VOICE_ID_4:-}
      TTS_VOICE_ID_5: ${TTS_VOICE_ID_5:-}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY:-}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_URL: ${S3_URL:-}
    restart: unless-stopped

volumes:
  redis-data:
